# Test — run the Vitest suite on every push and PR.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - run: npm test

      - name: Validate production build
        run: npm run build
