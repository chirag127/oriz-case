# Test — run the Vitest suite on every push and PR.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Resolve workspace file deps to npm registry"
        run: |
          sed -i 's|"file:\.\./design-system/packages/oz-ai"|"^0.3.1"|g; s|"file:\.\./design-system/packages/oz-chrome"|"^0.1.0"|g; s|"file:\.\./design-system/packages/oz-file"|"^0.1.0"|g; s|"file:\.\./design-system/packages/oz-tokens-base"|"^0.1.0"|g' package.json
          rm -f package-lock.json

      - run: npm install --legacy-peer-deps

      - run: npm test
